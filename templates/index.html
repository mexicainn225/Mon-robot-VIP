<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGNAL GAME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0e1015; color: #ffffff; padding: 16px; min-height: 100vh; text-align: center; }
        
        .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .game-card { border-radius: 14px; aspect-ratio: 1 / 1.4; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 10px; cursor: pointer; background-size: cover; background-position: center; background-color: #151822; font-size: 10px; font-weight: bold; text-transform: uppercase; border: 1px solid #333; }
        
        .g164 { background-image: url("{{ url_for('static', filename='IMG_0164.WEBP') }}"); }
        .g165 { background-image: url("{{ url_for('static', filename='IMG_0165.WEBP') }}"); }
        .g166 { background-image: url("{{ url_for('static', filename='IMG_0166.WEBP') }}"); }
        .g167 { background-image: url("{{ url_for('static', filename='IMG_0167.WEBP') }}"); }
        .g168 { background-image: url("{{ url_for('static', filename='IMG_0168.WEBP') }}"); }
        .g170 { background-image: url("{{ url_for('static', filename='IMG_0170.WEBP') }}"); }
        .g171 { background-image: url("{{ url_for('static', filename='IMG_0171.WEBP') }}"); }
        .g172 { background-image: url("{{ url_for('static', filename='IMG_0172.WEBP') }}"); }
        .g173 { background-image: url("{{ url_for('static', filename='IMG_0173.WEBP') }}"); }
        .g174 { background-image: url("{{ url_for('static', filename='IMG_0174.WEBP') }}"); }
        
        .g3934 { background-image: url("{{ url_for('static', filename='IMG_3934.jpeg') }}"); }
        .g3935 { background-image: url("{{ url_for('static', filename='IMG_3935.jpeg') }}"); }
        .g3936 { background-image: url("{{ url_for('static', filename='IMG_3936.jpeg') }}"); }
        
        #interface-signal { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin-top: 20px; }
        
        .result-container { 
            padding: 20px; border-radius: 15px; margin: 20px 0; border: 1px solid #333; width: 90%; 
            background-size: cover; background-position: center; 
            background-color: rgba(28, 31, 38, 0.9); background-blend-mode: overlay;
        }

        /* --- STYLE DU CERCLE LUMINEUX (JETX) --- */
        .cercle-radar {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 50%;
            border: 3px solid #333;
            background: rgba(20, 25, 35, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .cercle-radar.illumine {
            border-color: #00ffcc;
            box-shadow: 0 0 25px #00ffcc, inset 0 0 15px #00ffcc;
        }

        .cercle-heure {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .cercle-cote {
            font-size: 13px;
            font-weight: bold;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cote-label { color: #888; font-size: 14px; }
        .cote-value { color: #00ffcc; font-size: 28px; font-weight: bold; margin: 10px 0; }
        
        .instruction-box { font-size: 13px; color: #ffcc00; margin: 10px 0; font-weight: bold; line-height: 1.4; }
        
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 240px; margin: 15px auto; }
        .mine-cell { aspect-ratio: 1 / 1; background-color: #1a1e29; border: 1px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .mine-cell.active { background-color: #00ffcc22; border-color: #00ffcc; box-shadow: 0 0 10px #00ffcc44; }

        .btn-action { background: #00ffcc; color: #0e1015; border: none; padding: 15px; border-radius: 30px; font-weight: bold; width: 90%; margin-bottom: 10px; cursor: pointer; }
        .btn-back { background: #e0e0e0; color: #333; border: none; padding: 15px; border-radius: 30px; font-weight: bold; width: 90%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="main-menu">
        <h1>PLATEFORME VIP</h1>
        <div class="games-grid">
            <div class="game-card g164" onclick="ouvrirJeu('Lucky Jet', 'g164')">Lucky Jet</div>
            <div class="game-card g165" onclick="ouvrirJeu('Rocket Queen', 'g165')">Rocket Queen</div>
            <div class="game-card g166" onclick="ouvrirJeu('1win Crash', 'g166')">1win Crash</div>
            <div class="game-card g167" onclick="ouvrirJeu('Tropicana', 'g167')">Tropicana</div>
            <div class="game-card g168" onclick="ouvrirJeu('Fortune Crash', 'g168')">Fortune Crash</div>
            <div class="game-card g170" onclick="ouvrirJeu('Meta Crash', 'g170')">Meta Crash</div>
            <div class="game-card g171" onclick="ouvrirJeu('Empire Crime', 'g171')">Empire Crime</div>
            <div class="game-card g172" onclick="ouvrirJeu('Astronaut', 'g172')">Astronaut</div>
            <div class="game-card g173" onclick="ouvrirJeu('Aviator', 'g173')">Aviator</div>
            <div class="game-card g174" onclick="ouvrirJeu('JetX', 'g174')">JetX</div>
            <div class="game-card g3934" onclick="ouvrirJeu('Mines BB', 'g3934')">Mines BB</div>
            <div class="game-card g3935" onclick="ouvrirJeu('Mines', 'g3935')">Mines</div>
            <div class="game-card g3936" onclick="ouvrirJeu('Mines Classic', 'g3936')">Mines Classic</div>
        </div>
    </div>

    <div id="interface-signal">
        <h2 id="nom-jeu"></h2>
        <div class="result-container" id="res-box">
            
            <!-- Affichage Standard (Autres jeux) -->
            <div id="standard-view">
                <div class="cote-label" id="label-resultat">Cote cible</div>
                <div id="valeur-principale" class="cote-value">-</div>
                <div id="info-lancer" style="font-size: 14px; color: #ccc;"></div>
            </div>

            <!-- Cercle Lumineux (JetX) -->
            <div id="jetx-cercle-view" style="display: none;">
                <div class="cercle-radar" id="cercleRadar">
                    <div class="cercle-heure" id="cercleHeureVal">--:--:--</div>
                    <div class="cercle-cote" id="cercleCoteVal">COTE --</div>
                </div>
            </div>
            
            <div id="instruction-texte" class="instruction-box"></div>
            
            <div id="mines-view" style="display: none;">
                <div class="mines-grid" id="minesGridContainer"></div>
            </div>

            <div id="fiabilite-affichage" style="font-size: 13px; color: #00ffcc; margin-top:5px; font-weight: bold;"></div>
        </div>
        <button class="btn-action" onclick="lancerCalcul()">DEMANDER SIGNAL</button>
        <button class="btn-back" onclick="fermerJeu()">RETOUR</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        const gameConfigs = {
            "Lucky Jet": {"type": "crash", "cycle": 3, "sec": 15, "start": [0, 0], "fiabilite": "1.5x"},
            "Rocket Queen": {"type": "crash", "cycle": 4, "sec": 45, "start": [0, 0], "fiabilite": "2.0x"},
            "1win Crash": {"type": "crash", "cycle": 5, "sec": 10, "start": [0, 0], "fiabilite": "2.0x"},
            "Tropicana": {"type": "crash", "cycle": 5, "sec": 20, "start": [0, 0], "fiabilite": "1.5x"},
            "Fortune Crash": {"type": "crash", "cycle": 5, "sec": 25, "start": [0, 0], "fiabilite": "2.0x"},
            "Meta Crash": {"type": "crash", "cycle": 7, "sec": 0, "start": [0, 0], "fiabilite": "2.0x"},
            "Empire Crime": {"type": "crash", "cycle": 8, "sec": 50, "start": [0, 0], "fiabilite": "2.0x"},
            "Astronaut": {"type": "crash", "cycle": 6, "sec": 5, "start": [0, 0], "fiabilite": "2.0x"},
            "Aviator": {"type": "crash", "cycle": 3, "sec": 30, "start": [0, 0], "fiabilite": "1.5x"},
            "JetX": {"type": "jetx_cercle", "cycle": 4, "sec": 20, "start": [0, 1], "fiabilite": "96%"},
            
            "Mines BB": {"type": "mines", "cycle": 3, "start": [0, 0], "nbEtoiles": 6, "fiabilite": "91%"},
            "Mines": {"type": "mines", "cycle": 5, "start": [0, 0], "nbEtoiles": 7, "fiabilite": "94%"},
            "Mines Classic": {"type": "mines", "cycle": 4, "start": [0, 0], "nbEtoiles": 5, "fiabilite": "89%"}
        };

        let jeuActuel = "";

        function ouvrirJeu(nom, classe) {
            jeuActuel = nom;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('interface-signal').style.display = 'flex';
            document.getElementById('nom-jeu').innerText = nom;
            document.getElementById('res-box').className = 'result-container ' + classe;

            const isJetX = (nom === 'JetX');
            const isMines = (gameConfigs[nom].type === 'mines');

            document.getElementById('standard-view').style.display = isJetX || isMines ? 'none' : 'block';
            document.getElementById('jetx-cercle-view').style.display = isJetX ? 'block' : 'none';
            document.getElementById('mines-view').style.display = isMines ? 'block' : 'none';

            if(isJetX) {
                document.getElementById('cercleRadar').classList.remove('illumine');
                document.getElementById('cercleHeureVal').innerText = "--:--:--";
                document.getElementById('cercleCoteVal').innerText = "COTE --";
            }
        }

        function fermerJeu() {
            document.getElementById('main-menu').style.display = 'block';
            document.getElementById('interface-signal').style.display = 'none';
        }

        function pseudoRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function lancerCalcul() {
            const conf = gameConfigs[jeuActuel];
            tg.HapticFeedback.impactOccurred('medium');

            const now = new Date();

            if (conf.type === 'mines') {
                const startMins = conf.start[0] * 60 + conf.start[1];
                const nowMins = now.getHours() * 60 + now.getMinutes();
                const elapsed = Math.max(0, nowMins - startMins);
                const nextLaunch = startMins + Math.ceil((elapsed + 1) / conf.cycle) * conf.cycle;
                
                const h = Math.floor(nextLaunch / 60) % 24;
                const m = nextLaunch % 60;
                const timeStr = h.toString().padStart(2, '0') + ":" + m.toString().padStart(2, '0');
                
                document.getElementById('info-lancer').innerText = "Lancer à : " + timeStr;
                document.getElementById('instruction-texte').innerText = "Piège sur 3, essayer 3 fois dans la minute en cas de perte.";
                
                const container = document.getElementById('minesGridContainer');
                container.innerHTML = '';
                for (let i = 0; i < 25; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'mine-cell';
                    container.appendChild(cell);
                }

                let seed = nextLaunch * 99; 
                let gagnees = [];
                while(gagnees.length < conf.nbEtoiles) {
                    let r = Math.floor(pseudoRandom(seed++) * 25);
                    if(!gagnees.includes(r)) gagnees.push(r);
                }

                gagnees.forEach(index => {
                    container.children[index].className = 'mine-cell active';
                    container.children[index].innerText = '⭐';
                });
                document.getElementById('valeur-principale').innerText = "PRÊT";
            } 
            else if (conf.type === 'jetx_cercle') {
                const totalSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + conf.sec;
                const cycleSec = conf.cycle * 60;
                const nextLaunchSec = Math.ceil((totalSeconds + 1) / cycleSec) * cycleSec;
                
                const h = Math.floor(nextLaunchSec / 3600) % 24;
                const m = Math.floor((nextLaunchSec % 3600) / 60);
                const s = conf.sec;
                
                const timeStr = h.toString().padStart(2, '0') + ":" + m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
                
                // Première cote aléatoire entre 2 et 3 (avec 2 décimales)
                let minCote = (2 + pseudoRandom(nextLaunchSec) * 1).toFixed(2);
                // Deuxième cote aléatoire entre 5 et 20 (avec 2 décimales)
                let maxCote = (5 + pseudoRandom(nextLaunchSec + 1) * 15).toFixed(2);

                document.getElementById('cercleHeureVal').innerText = timeStr;
                document.getElementById('cercleCoteVal').innerText = "COTE " + minCote + " À " + maxCote;
                
                const cercle = document.getElementById('cercleRadar');
                cercle.classList.add('illumine');

                document.getElementById('instruction-texte').innerText = "⚡ Signal validé pour ce tour !";
            }
            else {
                const totalSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + conf.sec;
                const cycleSec = conf.cycle * 60;
                const nextLaunchSec = Math.ceil((totalSeconds + 1) / cycleSec) * cycleSec;
                
                const h = Math.floor(nextLaunchSec / 3600) % 24;
                const m = Math.floor((nextLaunchSec % 3600) / 60);
                const s = conf.sec;
                
                const timeStr = h.toString().padStart(2, '0') + ":" + m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
                
                document.getElementById('info-lancer').innerText = "Lancer à : " + timeStr;
                document.getElementById('instruction-texte').innerText = "";
                
                const cote = (10 + (Math.abs(Math.sin(nextLaunchSec)) * 10)).toFixed(2);
                document.getElementById('valeur-principale').innerText = cote + "x";
            }
            
            document.getElementById('fiabilite-affichage').innerText = "Indice de fiabilité : " + conf.fiabilite;
        }
    </script>
</body>
</html>
